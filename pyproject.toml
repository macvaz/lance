[project]
name = "lance-benchmarks"
version = "0.1.0"
description = "Testing random access performance of Lance datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "fastapi>=0.115.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pylance>=14.0.3",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
convert_from_parquet = "lance_tools.convert_from_parquet:main"
create_indexes = "lance_tools.create_indexes:main"
query_polars = "queries.polars:main"
query_duckdb = "queries.duckdb:main"
drop_indexes = "lance_tools.drop_indexes:main"
query_native = "queries.native:main"
api = "api:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["constants", "api"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lance_tools*", "queries*", "models*", "datasets*"]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "ipython>=9.0.0",
]
