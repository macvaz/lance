[project]
name = "lance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pylance>=14.0.3",
]

[project.scripts]
convert = "convert_to_lance:main"
create_indexes = "create_indexes:main"
query_polars = "query_polars:main"
drop_indexes = "drop_indexes:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["constants", "convert_to_lance", "create_indexes", "drop_indexes", "query_polars"]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "ipython>=9.0.0",
]
